<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Platformer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: monospace;
      color: #fff;
    }
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #5c94fc;
      border: none;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

<div id="letter-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 10;">
  <div style="width: 80vw; max-width: 800px; height: 80vh; max-height: 800px; background: #f4e3c5; border: 8px solid #8B5A2B; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;">
    <p id="letter-text" style="font-family: 'Press Start 2P', monospace; font-size: 18px; line-height: 2; color: #333; overflow-y: auto; margin: 0;"></p>
    <button id="close-btn" style="font-family: 'Press Start 2P', monospace; font-size: 18px; padding: 20px; cursor: pointer; background: #d2a679; border: 4px solid #8B5A2B;">CLOSE</button>
  </div>
</div>

<canvas id="game" width="800" height="400"></canvas>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const keys = {};
  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);

  const levelWidth = 2400;
  const gravity = 0.5;

  let player = {
    x: 50,
    y: 300,
    w: 30,
    h: 40,
    vx: 0,
    vy: 0,
    grounded: false,
    score: 0,
    won: false
  };

  const platforms = [
    { x: 0, y: 360, w: 700, h: 40 },
    { x: 800, y: 360, w: 600, h: 40 },
    { x: 1500, y: 360, w: 900, h: 40 },
    { x: 300, y: 260, w: 100, h: 20 },
    { x: 500, y: 200, w: 100, h: 20 },
    { x: 1000, y: 260, w: 120, h: 20 },
    { x: 1200, y: 180, w: 100, h: 20 },
    { x: 1700, y: 260, w: 150, h: 20 }
  ];

  let isPaused = false;

  const coins = [
    { x: 335, y: 220, r: 8, collected: false, message: "lorem ipsum dolor sit amet consectetur adipiscing elit qui ipsum qui nostrud nam nisi omnis molestias id irure voluptate culpa elit nisi praesentium dolores nam sint maxime minus qui consequatur fugiat omnis in distinctio incididunt esse animi in deserunt repellendus tempor qui fugiat qui provident qui officia nam duis possimus harum eiusmod id id et ullamco vel facere laboris temporibus ut et elit harum quod voluptate est excepteur id cillum atque eu facilis amet est cillum non consequatur distinctio sit voluptatum ea quo quod facere lorem tempore dolore lorem vel officia sed id et occaecat distinctio eu animi et dolor in mollit officia fuga dolore elit assumenda non aute repellendus quidem ducimus dolor aliquip velit laboris cupidatat eiusmod sunt est fuga excepturi placeat nostrud elit in voluptas est aute est officia irure assumenda minim ea animi sed velit illum velit odio soluta deleniti quas autem esse sunt expedita amet laborum ducimus dolore animi id enim dolor illum incididunt sint in ut quas nisi excepturi reprehenderit eu culpa est possimus facilis eiusmod enim corrupti ullamco veniam eos cupidatat distinctio animi iusto molestias omnis animi deserunt eiusmod duis amet laborum ut eum ex minus dignissimos quas non quis expedita assumenda soluta aute" },
    { x: 535, y: 160, r: 8, collected: false, message: "Letter 2 content here." },
    { x: 900, y: 320, r: 8, collected: false, message: "Letter 3 content here." },
    { x: 1045, y: 220, r: 8, collected: false, message: "Letter 4 content here." },
    { x: 1235, y: 140, r: 8, collected: false, message: "Letter 5 content here." },
    { x: 1765, y: 220, r: 8, collected: false, message: "Letter 6 content here." }
  ];

  const flag = { x: 2200, y: 160, w: 10, h: 200, flagW: 40, flagH: 30 };

  function reset() {
    player.x = 50;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.score = 0;
    player.won = false;
    coins.forEach(c => c.collected = false);
  }

  function update() {
    if (player.won) return;
    if (isPaused) return;

    if (keys['ArrowRight'] || keys['KeyD']) player.vx = 4;
    else if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -4;
    else player.vx = 0;

    if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
      player.vy = -11;
      player.grounded = false;
    }

    player.vy += gravity;
    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;
    for (let p of platforms) {
      if (
        player.x < p.x + p.w &&
        player.x + player.w > p.x &&
        player.y < p.y + p.h &&
        player.y + player.h > p.y
      ) {
        if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 12) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.grounded = true;
        }
      }
    }

    for (let c of coins) {
      if (
        !c.collected &&
        player.x < c.x + c.r &&
        player.x + player.w > c.x - c.r &&
        player.y < c.y + c.r &&
        player.y + player.h > c.y - c.r
      ) {
        c.collected = true;
        player.score += 10;
        document.getElementById('letter-text').innerText = c.message;
        document.getElementById('letter-overlay').style.display = 'flex';
        isPaused = true;
      }
    }

    if (player.x + player.w >= flag.x) {
      player.won = true;
    }

    if (player.y > canvas.height + 100) {
      reset();
    }
  }

  const cakeImg = new Image();
  cakeImg.src = 'asset/cake.png';

  function draw() {
    let cameraX = Math.max(0, Math.min(player.x - canvas.width / 3, levelWidth - canvas.width));

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-cameraX, 0);

    ctx.fillStyle = '#8B5A2B';
    for (let p of platforms) {
      ctx.fillRect(p.x, p.y, p.w, p.h);
    }

    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let c of coins) {
      if (!c.collected) {
        ctx.fillText('🎂', c.x, c.y);
      }
    }

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(flag.x + flag.w, flag.y, flag.flagW, flag.flagH);

    ctx.fillStyle = '#FF0000';
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.restore();

    ctx.fillStyle = '#FFFFFF';
    ctx.font = '20px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`COINS: ${player.score}`, 20, 30);

    if (player.won) {
      ctx.fillStyle = '#00FF00';
      ctx.font = '36px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('STAGE CLEAR', canvas.width / 2, canvas.height / 2);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();

  document.getElementById('close-btn').addEventListener('click', () => {
    document.getElementById('letter-overlay').style.display = 'none';
    isPaused = false;
  });
</script>
</body>
</html>
